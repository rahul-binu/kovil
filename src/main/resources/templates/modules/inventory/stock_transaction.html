<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/app.html}">

<th:block layout:fragment="head">
	<title>Dashboard</title>
</th:block>

<div layout:fragment="content" class="p-4">

	<link rel="stylesheet" th:href="@{/assets/lib/pagination/pagination.css}" />

	<div id="stockTransModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">

		<div class="bg-white w-full max-w-lg rounded-xl shadow-xl p-6">

			<h2 class="text-lg font-semibold text-gray-800 mb-4">
				Add Stock Entry
			</h2>

			<div id="stockForm" class="space-y-4">

				<div>
					<label class="text-sm font-medium">Transaction Date</label>
					<input id="StockTransactionDate" type="datetime-local" th:value="${dateTime}"
						class="w-full mt-1 border rounded-lg p-2">
				</div>

				<div class="grid grid-cols-2 gap-4">
					<div class="relative">
						<label class="text-sm font-medium">Item</label>
						<select id="stockItem" class="w-full mt-1 border rounded-lg p-2">
							<option value="">Select Item</option>
						</select>
					</div>

					<div>
						<label class="text-sm font-medium">Transaction Type</label>
						<select id="stockTransactionType" class="w-full mt-1 border rounded-lg p-2">
							<option th:each="t : ${transType}" th:value="${t}" th:text="${t}">-</option>
						</select>
					</div>
				</div>

				<div class="grid grid-cols-2 gap-4">
					<div>
						<label class="text-sm font-medium">Quantity</label>
						<input id="quantity" type="number" step="0.01" class="w-full mt-1 border rounded-lg p-2">
					</div>

					<div>
						<label class="text-sm font-medium">Unit</label>
						<select id="transactionUnit" class="w-full mt-1 border rounded-lg p-2">
							<option th:each="u : ${utype}" th:value="${u}" th:text="${u}">-</option>
						</select>
					</div>
				</div>

				<div>
					<label class="text-sm font-medium">Remarks</label>
					<textarea id="remarks" class="w-full mt-1 border rounded-lg p-2"></textarea>
				</div>

				<div class="mt-2">
					<div class="errorAppendArea"></div>
				</div>

				<div class="flex justify-end gap-3 pt-4">
					<button type="button" onclick="location.reload()"
						class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">
						Cancel
					</button>

					<button onclick="validateStockTransactionEntry()"
						class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700">
						Save
					</button>
				</div>

			</div>
		</div>
	</div>

	<div
		class="overflow-x-auto mt-2 bg-neutral-primary-soft block border border-default border-t-4 rounded-base shadow-xs">

		<div class="flex items-center my-10">
			<div class="flex-grow border-b-2 border-blue-500"></div>
			<span class="px-4 text-2xl font-bold text-gray-800">Stock Transaction</span>
			<div class="flex-grow border-b-2 border-blue-500"></div>
		</div>

		<div class="flex items-center justify-between mx-2 mb-3">
			<div class="flex items-end gap-4">
				<div>
					<label class="block text-sm font-medium text-gray-700">From</label>
					<input type="date" th:value="${date}" id="fromDate"
						class="w-64 mt-1 border rounded-lg px-3 py-2 focus:ring focus:ring-indigo-300">
				</div>
				<div>
					<label class="block text-sm font-medium text-gray-700">To</label>
					<input type="date" th:value="${date}" id="toDate"
						class="w-64 mt-1 border rounded-lg px-3 py-2 focus:ring focus:ring-indigo-300">
				</div>
				<button class="search-btn mt-6" id="searchBtn">Search</button>
			</div>
			<div class="flex gap-3">
				<button class="add-btn" onClick="openStockTransModal()">Entry</button>
				<button class="print-btn" id="htmlPrinttTable">Print</button>
			</div>
		</div>


		<div class="relative">

			<div id="tableLoader"
				class="absolute inset-0 bg-white/60 backdrop-blur-sm flex items-center justify-center hidden z-10">
				<div class="h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin">
				</div>
			</div>

			<div id="pagination">
				<table class="app-table" id="stockTable">
					<thead></thead>
					<tbody></tbody>
				</table>
			</div>
		</div>
	</div>

</div>


<div layout:fragment="scripts">
	<script th:src="@{/assets/lib/excel/exceljs.min.js}"></script>
	<script th:src="@{/assets/lib/excel/common.js}"></script>
	<script th:src="@{/assets/lib/pagination/pagination.js}"></script>

	<script th:src="@{/assets/modules/reports/common.js}"></script>
	<script th:src="@{/assets/modules/inventory/stock_transaction.js}"></script>
</div>

</html>
