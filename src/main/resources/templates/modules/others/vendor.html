<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/app.html}">

<th:block layout:fragment="head">
	<title>Dashboard</title>
</th:block>

<div layout:fragment="content" class="p-4">

	<link rel="stylesheet" th:href="@{/assets/lib/pagination/pagination.css}" />

	<div class="overflow-x-auto mt-2 bg-neutral-primary-soft block border border-default border-t-4 rounded-base shadow-xs"
		id="poojaMasterPaginateArea">

		<div class="flex items-center my-10">
			<div class="flex-grow border-b-2 border-blue-500"></div>
			<span class="px-4 text-2xl font-bold text-gray-800"><span id="vendorTypeLabel"></span> Report</span>
			<div class="flex-grow border-b-2 border-blue-500"></div>
		</div>

		<div class="flex justify-end mb-2 mx-2 gap-3">
			<input type="date" th:value="${from}" class="border px-3 py-2 rounded-md" id="fromDate">
			<input type="date" th:value="${to}"class="border px-3 py-2 rounded-md" id="toDate">
			<button id="searchVendors" class="search-btn px-5 py-2 h-[42px]">Search</button>
			<button class="excel-btn" id="excelExportVendor">Export Excel</button>
			<button class="print-btn" id="htmlPrintVendor">Print</button>

		</div>
		<div class="relative">

			<div id="tableLoader"
				class="absolute inset-0 bg-white/60 backdrop-blur-sm flex items-center justify-center hidden z-10">
				<div class="h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin">
				</div>
			</div>

			<div id="pagination">
				<table class="app-table" id="vendorTable">
					<thead> </thead>
					<tbody></tbody>
					<tfoot></tfoot>
				</table>
			</div>
		</div>
	</div>

	<input type="hidden" th:value="${vtype}" id="vendorType">
</div>


<div layout:fragment="scripts">
	<script th:src="@{/assets/lib/excel/exceljs.min.js}"></script>
	<script th:src="@{/assets/lib/excel/common.js}"></script>
	<script th:src="@{/assets/lib/pagination/pagination.js}">
	</script>

	<script th:src="@{/assets/modules/reports/common.js}"></script>
	<script th:src="@{/assets/modules/reports/vendor/vendor.js}"></script>
</div>

</html>
