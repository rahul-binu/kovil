<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/app.html}">

<th:block layout:fragment="head">
	<title>Dashboard</title>
</th:block>

<div layout:fragment="content" class="p-4 pt-16">
	<script src="https://cdn.tailwindcss.com"></script>

	<!-- Chart.js CDN -->
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

	<!-- Flatpickr (Calendar) CDN -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
	<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

	<style>
		/* Custom card shadow for dashboard */
		.card {
			@apply bg-white/80 backdrop-blur-md rounded-xl p-4 shadow-lg;
		}
	</style>
	<div class="flex">


		<!-- Main content -->
		<main class="flex-1 p-6 space-y-6">

			<!-- Header -->
			<header class="flex justify-between items-center mb-6">
			</header>

			<!-- Charts -->
			<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

				<div class="card">
					<h3 class="font-semibold mb-2 text-purple-800">Poojas Completed</h3>
					<canvas id="poojaChart" height="200"></canvas>
				</div>

				<div class="card">
					<h3 class="font-semibold mb-2 text-purple-800">Devotee Registrations</h3>
					<canvas id="devoteeChart" height="200"></canvas>
				</div>

				<div class="card">
					<h3 class="font-semibold mb-2 text-purple-800">Vazhipads</h3>
					<canvas id="vazhipadChart" height="100"></canvas>
				</div>

			</div>


			<!-- calamned-->
			<div id="panchangCalendar"
				class="bg-white/80 backdrop-blur-md rounded-xl shadow-lg p-4 w-full max-w-md mx-auto">
				<h2 class="text-lg text-center font-semibold mb-4 text-[#3B1E8A]">Pooja Bookings</h2>

				<input type="date" id="poojaBookingDate" th:value="${today}">
				<button class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md"
					onclick="loadBooking()">Find</button>
				<div class="overflow-x-auto">
					<table class="w-full border border-gray-200 rounded-lg text-sm">
						<thead class="bg-[#3B1E8A] text-white">
							<tr>
								<th class="px-3 py-2 text-left">First Name</th>
								<th class="px-3 py-2 text-left">Phone</th>
								<th class="px-3 py-2 text-center">Action</th>
							</tr>
						</thead>

						<tbody class="divide-y divide-gray-200">
							<tr>
								<td class="px-3 py-2">Rahul</td>
								<td class="px-3 py-2">9876543210</td>
								<td class="px-3 py-2 text-center">
									<button class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded-md">
										View
									</button>
								</td>
							</tr>

						</tbody>
					</table>
				</div>

			</div>



	</div>


	<div id="poojaModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
		<div class="bg-white w-full max-w-lg rounded-lg shadow-lg p-6">

			<div class="flex justify-between items-center mb-4">
				<h2 class="text-lg font-semibold">Pooja Booking Details</h2>
				<button onclick="closePoojaModal()" class="text-gray-500 hover:text-black">✕</button>
			</div>

			<div id="modalContent" class="space-y-3 text-sm"></div>

			<div class="mt-4 text-right">
				<button onclick="closePoojaModal()" class="px-4 py-2 bg-gray-700 text-white rounded-md">
					Close
				</button>
			</div>
		</div>
	</div>

</div>

<div layout:fragment="scripts">
	<script th:src="@{/assets/modules/others/dashboard.js}"></script>

	<script src="https://cdn.jsdelivr.net/npm/panchang-js@latest/dist/panchang.min.js"></script>
</div>
