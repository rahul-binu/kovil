<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/app.html}">

<th:block layout:fragment="head">
	<title>Pooja Report</title>
</th:block>
<div layout:fragment="content">

	<link rel="stylesheet" th:href="@{/assets/lib/simplepagination/simplePagination.css}" />
	<div class="min-h-screen bg-gray-100 p-6">
		<div class="">

			<div class="flex items-center my-10">
				<div class="flex-grow border-b-2 border-blue-500"></div>
				<span class="px-4 text-2xl font-bold text-gray-800">Account Ledger</span>
				<div class="flex-grow border-b-2 border-blue-500"></div>
			</div>

			<div class="bg-white rounded-xl shadow-lg p-8 mb-12 border border-gray-100">

				<div class="grid grid-cols-1 md:grid-cols-5 gap-6">

					<div>
						<label class="block text-sm font-medium text-gray-700 mb-1">Ledger Name</label>
						<input type="text" id="ledgerName"
							class="clear-input w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-2 focus:ring-blue-300 focus:border-blue-500 transition">
					</div>

					<div class="relative">
						<label class="block text-sm font-medium text-gray-700 mb-1">Ledger Group</label>
						<select id="ledgerUnder" name="ledgerUnder"
							class="w-full px-3 py-2 border rounded-md focus:ring focus:border-indigo-400">
							<option value="">Choose Group</option>
						</select>
					</div>

					<div>
						<label class="block text-sm font-medium text-gray-700 mb-1">Order</label>
						<input type="number" id="ledgerOrder"
							class="clear-input w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-2 focus:ring-blue-300 focus:border-blue-500 transition">
					</div>
					<div>
						<label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
						<input type="text" id="ledgerDescription"
							class="clear-input w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-2 focus:ring-blue-300 focus:border-blue-500 transition">
					</div>


					<div class="flex items-end">
						<button class="save-btn" id="saveUpdateAccountLedger">Save</button>
						<button class="cancel-btn" onclick="location.reload()">Cancel</button>
					</div>


				</div>
				<div class="grid grid-cols-1gap-6">
					<div class="col-1 errorAppendArea">

					</div>
				</div>

				<div class="relative">

					<div id="tableLoader"
						class="absolute inset-0 bg-white/60 backdrop-blur-sm flex items-center justify-center hidden z-10">
						<div class="h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin">
						</div>
					</div>

					<div class="bg-white rounded-xl overflow-hidden">

						<div class="pagination">
							<table class="app-table" id="ledgerTable">
								<thead>
									<tr>
										<th class="p-3 text-left">SN</th>
										<th class="p-3 text-left">Name</th>
										<th class="p-3 text-left">Ledger Group</th>
										<th class="p-3 text-left">Ledger Type</th>
										<th class="p-3 text-left">Order</th>
										<th class="p-3 text-left">Description</th>
										<th class="p-3 text-left">Action</th>
									</tr>
								</thead>

								<tbody>
								</tbody>
								<tfoot>
									<tr></tr>
								</tfoot>
							</table>
						</div>
						<div id="paginationPage" class="mt-4 px-3"></div>
					</div>
				</div>

			</div>
		</div>
	</div>
</div>


<div layout:fragment="scripts">
	<script th:src="@{/assets/lib/simplepagination/simplePagination.min.js}"></script>
	<script th:src="@{/assets/modules/account/ledger.js}"></script>
</div>

</html>
