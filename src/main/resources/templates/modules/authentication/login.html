<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

	 <script th:src="@{/assets/lib/tailwind.min.js}"></script>

</head>

<body 
    class="flex items-center justify-end min-h-screen bg-cover bg-center p-6"
    style="background-image: url('/dynamic/assets/app_images/login.jpg');"
>

    <div class="w-full max-w-lg 
                bg-white/20 backdrop-blur-md 
                shadow-2xl rounded-2xl p-8 
                border border-white/30">
        <h2 class="text-2xl font-semibold text-center text-white mb-6 drop-shadow">
            Login
        </h2>

        <div th:if="${param.error}" 
             class="bg-red-100/80 text-red-800 p-2 rounded text-sm mb-4 text-center">
            Invalid username or password
        </div>

        <form th:action="@{/web/auth/login}" method="post" class="space-y-4">

			<div th:if="${error}"
			     class="bg-red-100/80 text-red-800 p-2 rounded text-sm mb-4 text-center">
			    Invalid username or password
			</div>

            <div>
                <label class="block mb-1 font-medium text-white drop-shadow">Username</label>
                <input type="text"
                       name="userName"
                       class="w-full px-3 py-2 border border-white/40 bg-white/20 text-white 
                              placeholder-gray-200 rounded-lg focus:outline-none 
                              focus:ring-2 focus:ring-blue-300 backdrop-blur-md"
                       placeholder="Enter username" required>
            </div>

            <div>
                <label class="block mb-1 font-medium text-white drop-shadow">Password</label>
                <input type="password"
                       name="password"
                       class="w-full px-3 py-2 border border-white/40 bg-white/20 text-white 
                              placeholder-gray-200 rounded-lg focus:outline-none 
                              focus:ring-2 focus:ring-blue-300 backdrop-blur-md"
                       placeholder="Enter password" required>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600/80 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
                Login
            </button>

        </form>

    </div>

</body>

</html>
