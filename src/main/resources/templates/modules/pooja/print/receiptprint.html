<!DOCTYPE html>
<html lang="ml">

<head>
	<meta charset="UTF-8">
	<title>Receipt Print</title>

	<style>
		@page {
			size: A4;
			margin: 0;
		}

		body {
			margin: 0;
			font-family: "Noto Sans Malayalam", sans-serif;
		}

		/* PAGE */
		.html-page-wrapper {
			width: 210mm;
			height: 297mm;
			display: flex;
			flex-direction: column;
			page-break-after: always;
		}

		/* EACH RECEIPT (4 × per page) */
		.html-receipt {
			height: 74.25mm;
			/* 297 / 4 */
			width: 100%;
			box-sizing: border-box;
			padding: 6mm;
			border-bottom: 1px dashed #000;
		}

		/* OUTER BORDER BOX */
		.html-box {
			height: 100%;
			position: relative;
			padding: 2px;
			box-sizing: border-box;
			border: 2.5px solid rgb(53, 132, 228);
		}

		/* INNER SOLID BORDER */
		.html-box::before {
			content: "";
			position: absolute;
			top: 5px;
			left: 5px;
			right: 5px;
			bottom: 5px;
			border: 1.2px solid rgb(28, 113, 216);
			pointer-events: none;
		}

		/* INNER DOTTED BORDER */
		.html-box::after {
			content: "";
			position: absolute;
			top: 11px;
			left: 11px;
			right: 11px;
			bottom: 11px;
			border: 1px dotted rgb(98, 160, 234);
			pointer-events: none;
		}

		/* LOGO */
		.html-logo {
			position: absolute;
			top: 12px;
			left: 12px;
			width: 65px;
		}

		/* HEADER */
		.html-header {
			padding-top: 12px;
			padding-right: 12px;
			padding-left: 12px;
			text-align: center;
			font-weight: bold;
			font-size: 15px;
			line-height: 1.35;
		}

		.rep-address{
			text-align: center;
			font-weight: bold;
			font-size: 12px;
		}
		
		/* SUB TITLE */
		.html-sub-title {
			/*background: rgb(0, 0, 0);
			color: #fff;*/
			display: inline-block;
			padding: 2px 10px;
			margin-top: 5px;
			font-size: 14px;
			border-radius: 3px;
		}

		/* CONTENT ROWS */
		.html-row {
			padding-right: 12px;
			padding-left: 12px;
			margin-top: 8px;
			font-size: 14px;
		}

		.html-field label {
			display: inline-block;
			width: 80px;
		}

		.html-line {
			display: inline-block;
			width: 70%;
			border-bottom: 1px dotted #000;
			padding-bottom: 2px;
		}

		.html-red {
			color: red;
			font-weight: bold;
		}

		/* FOOTER */
		.html-amount-box {
			position: absolute;
			bottom: 15px;
			left: 14px;
			font-size: 16px;
			font-weight: bold;
		}

		.html-wamount-box {
			position: absolute;
			bottom: 15px;
			left: 120px;
			font-size: 16px;
			font-weight: bold;
		}

		.html-treasurer {
			position: absolute;
			bottom: 18px;
			right: 16px;
			font-size: 14px;
		}
	</style>
</head>

<body>

	<div class="html-page-wrapper" id="printAppendArea">

	</div>
	<input type="hidden" id="transid" th:value="${transid}">
	<input type="hidden" id="isMalayalam" th:value="${ism}">

	<script th:src="@{/assets/common/js/app.js}"></script>
	<script th:src="@{/assets/lib/jquery-3.7.1.min.js}"></script>
	<script>
		$(function () {


			fetch(`/api/print/pooja/${$("#transid").val()}`, {
				method: "GET",
				headers: {
					"Accept": "application/json",
					"Authorization": "Bearer " + localStorage.getItem("jwtToken")
				}
			})
				.then(res => {
					if (!res.ok) {
						throw new Error(`HTTP error! Status: ${res.status}`);
					}
					return res.json();
				})
				.then(data => {
					if (Array.isArray(data)) {
						data.forEach(d => preparePrint(d));
					} else {
						preparePrint(data);
					}
				})
				.catch(err => {
					console.error("Fetch failed:", err);
				});

		});


		function preparePrint(data) {
			const PER_PAGE = 4;
			let page;

			for (let i = 0; i < data.poojat.length; i++) {
				let pt = data.poojat[i];
				let pm = pt.poojaMaster;
				let vn = data.vendor;
				let pj = data.pooja;

				if (i % PER_PAGE === 0) {
					page = $('<div class="html-page-wrapper"></div>');
					$("#printAppendArea").append(page);
				}

				page.append(getReceiptPrint({
					rNo: pt.prefix.replace(/@n@/i, pt.receiptNo),
					dt: formatDateTime(pj.date),
					dname: vn.fullName,
					dadd: vn.familyName + " " + vn.address,
					naksh: vn.nakshathra,
					amt: pt.amount,
					poojaT: pm.name
				}));
			}

		}
		function getReceiptPrint(data = {}) {

			let {
				rNo = "0",
				dt = "00/00/0000",
				dname = "Name",
				dadd = "Address",
				naksh = "Birth Star",
				amt = "0.0",
				poojaT = "Pooja"
			} = data;
			if ($("#isMalayalam").val() == '0') {

				return `
				    <div class="html-receipt">
				        <div class="html-box">

				            <img src="/dynamic/assets/app_images/default_images/ayyappan_logo-removebg-preview.png"
				                 class="html-logo" alt="Logo">

				            <div class="html-header">
							SREE PRANCHERI KANDAN SASTHA KSHETRAM, <br>
				            <span class="rep-address">S. T. Mankad. Kanyakumari Dist. Mob : 9442 401 458</span><br>
				                <span class="html-sub-title">${poojaT} Receipt</span>
				            </div>

				            <div class="html-row html-field">
				                <label>Number:</label>
				                <span class="html-red">${rNo}</span>
				                <span style="float:right;">Date: ${dt}</span>
				            </div>

				            <div class="html-row html-field">
				                <label>Name:</label>
				                <span class="html-line">${dname}</span>
				            </div>

				            <div class="html-row html-field">
				                <label>Address:</label>
				                <span class="html-line">${dadd}</span>
				            </div>

				            <div class="html-row html-field">
				                <label>Nakshatra:</label>
				                <span class="html-line">${naksh}</span>
				            </div>

				            <div class="html-amount-box">Rs. ${formatINR(amt)}/-</div>
							
							<div class="html-wamount-box">${amountToWords(amt)}/-</div>
							
				            <div class="html-treasurer">Treasurer</div>

				        </div>
				    </div>
				`;
			}

			return `
	        <div class="html-receipt">
	            <div class="html-box">

	                <img src="/dynamic/assets/app_images/default_images/ayyappan_logo-removebg-preview.png"
	                     class="html-logo" alt="Logo">

	                <div class="html-header">
					ശ്രീ പ്രാഞ്ചേരി കണ്ഠൻ ശാസ്താ ക്ഷേത്രം, 
	                    			എസ്. റ്റി. മങ്കാട്.<br>
						<span class="rep-address">S. T. Mankad. Kanyakumari Dist. Mob : 9442 401 458</span><br>
	                    <span class="html-sub-title">${poojaT} രസീത്</span>
	                </div>

	                <div class="html-row html-field">
	                    <label>നമ്പർ:</label>
	                    <span class="html-red">${rNo}</span>
	                    <span style="float:right;">തീയതി: ${dt}</span>
	                </div>

	                <div class="html-row html-field">
	                    <label>പേര്:</label>
	                    <span class="html-line">${dname}</span>
	                </div>

	                <div class="html-row html-field">
	                    <label>വിലാസം:</label>
	                    <span class="html-line">${dadd}</span>
	                </div>

	                <div class="html-row html-field">
	                    <label>നക്ഷത്രം:</label>
	                    <span class="html-line">${naksh}</span>
	                </div>

					<div class="html-amount-box">Rs. ${formatINR(amt)}/-</div>

					<div class="html-wamount-box">${amountToWords(amt)}/-</div>
					
	                <div class="html-treasurer">Treasurer</div>

	            </div>
	        </div>
	    `;
		}
	</script>



</body>

</html>
