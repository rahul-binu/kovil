<!DOCTYPE html>
<html lang="ml">

<head>
	<meta charset="UTF-8">
	<title>Receipt Print</title>

	<style>
		@page {
			size: A4;
			margin: 0;
		}

		body {
			margin: 0;
			font-family: "Noto Sans Malayalam", sans-serif;
		}

		.html-page-wrapper {
			width: 210mm;
			height: 297mm;
			display: flex;
			flex-direction: column;
			page-break-after: always;
			/* 🔥 THIS IS KEY */
		}


		/* EACH RECEIPT */
		.html-receipt {
			height: 99mm;
			width: 100%;
			box-sizing: border-box;
			padding: 10mm;
			border-bottom: 1px dashed #000;
		}

		/* CERTIFICATE BORDER BOX */
		.html-box {
			height: 100%;
			position: relative;
			padding: 4px;
			/* as requested */
			box-sizing: border-box;
			border: 3px solid rgb(53, 132, 228);
		}

		/* INNER SOLID BORDER */
		.html-box::before {
			content: "";
			position: absolute;
			top: 10px;
			left: 10px;
			right: 10px;
			bottom: 10px;
			border: 1.5px solid rgb(28, 113, 216);
			pointer-events: none;
		}

		/* INNER DOTTED DECOR */
		.html-box::after {
			content: "";
			position: absolute;
			top: 16px;
			left: 16px;
			right: 16px;
			bottom: 16px;
			border: 1px dotted rgb(98, 160, 234);
			pointer-events: none;
		}

		/* LOGO */
		.html-logo {
			position: absolute;
			top: 18px;
			/* pushed inward to avoid borders */
			left: 18px;
			width: 90px;
		}

		/* HEADER */
		.html-header {
			padding-top: 18px;
			padding-right: 18px;
			padding-left: 18px;
			text-align: center;
			font-weight: bold;
			font-size: 18px;
			line-height: 1.4;
		}

		/* SUB TITLE */
		.html-sub-title {
			background: #002d88;
			color: #fff;
			display: inline-block;
			padding: 2px 10px;
			margin-top: 5px;
			font-size: 14px;
			border-radius: 3px;
		}

		/* ROWS */
		.html-row {
			padding-right: 18px;
			padding-left: 18px;
			margin-top: 12px;
			font-size: 16px;
		}

		.html-field label {
			display: inline-block;
			width: 80px;
		}

		.html-line {
			display: inline-block;
			width: 70%;
			border-bottom: 1px dotted #000;
			padding-bottom: 2px;
		}

		.html-red {
			color: red;
			font-weight: bold;
		}

		/* FOOTER */
		.html-amount-box {
			position: absolute;
			bottom: 26px;
			left: 18px;
			font-size: 18px;
			font-weight: bold;
		}

		.html-treasurer {
			position: absolute;
			bottom: 26px;
			right: 22px;
			font-size: 16px;
		}
	</style>
</head>

<body>

	<div class="html-page-wrapper" id="printAppendArea">

	</div>
	<input type="hidden" id="transid" th:value="${transid}">

	<script th:src="@{/assets/common/js/app.js}"></script>
	<script th:src="@{/assets/lib/jquery-3.7.1.min.js}"></script>
	<script>
		$(function () {


			fetch(`/api/print/pooja/${$("#transid").val()}`, {
				method: "GET",
				headers: {
					"Accept": "application/json",
					"Authorization": "Bearer " + localStorage.getItem("jwtToken")
				}
			})
			.then(res => {
			    if (!res.ok) {
			        throw new Error(`HTTP error! Status: ${res.status}`);
			    }
			    return res.json();
			})
			.then(data => {
				preparePrint(data);
			})
			.catch(err => {
			    console.error("Fetch failed:", err);
			});
			
		});


		function preparePrint(data) {
			const PER_PAGE = 3;
			let page;

			for (let i = 0; i < data.poojat.length; i++) {
				let pt = data.poojat[i];
				let pm = pt.poojaMaster;
				let vn = data.vendor;
				let pj = data.pooja;

				if (i % PER_PAGE === 0) {
					page = $('<div class="html-page-wrapper"></div>');
					$("#printAppendArea").append(page);
				}

				page.append(getReceiptPrint({
					rNo: pt.prefix.replace(/@n@/i, pt.receiptNo),
					dt: formatDateTime(pj.date),
					dname: vn.fullName,
					dadd: vn.familyName+" "+vn.address,
					naksh: vn.nakshathra,
					amt: formatINR(pt.amount),
					poojaT: pm.name
				}));
			}

		}
		function getReceiptPrint(data = {}) {

			let {
				rNo = "0",
				dt = "00/00/0000",
				dname = "Name",
				dadd = "Address",
				naksh = "Birth Star",
				amt = "0.0",
				poojaT = "Pooja"
			} = data;

			return `
	        <div class="html-receipt">
	            <div class="html-box">

	                <img src="/dynamic/assets/app_images/default_images/ayyappan_logo-removebg-preview.png"
	                     class="html-logo" alt="Logo">

	                <div class="html-header">
					ശ്രീ പ്രാഞ്ചേരി കണ്ഠൻ ശാസ്താ ക്ഷേത്രം <br>
	                    			എസ്. റ്റി മങ്കാട്<br>
	                    <span class="html-sub-title">${poojaT} രസീത്</span>
	                </div>

	                <div class="html-row html-field">
	                    <label>നമ്പർ:</label>
	                    <span class="html-red">${rNo}</span>
	                    <span style="float:right;">തീയതി: ${dt}</span>
	                </div>

	                <div class="html-row html-field">
	                    <label>പേര്:</label>
	                    <span class="html-line">${dname}</span>
	                </div>

	                <div class="html-row html-field">
	                    <label>വിലാസം:</label>
	                    <span class="html-line">${dadd}</span>
	                </div>

	                <div class="html-row html-field">
	                    <label>നക്ഷത്രം :</label>
	                    <span class="html-line">${naksh}</span>
	                </div>

	                <div class="html-amount-box">Rs. ${amt}/-</div>
	                <div class="html-treasurer">Treasurer</div>

	            </div>
	        </div>
	    `;
		}
	</script>



</body>

</html>
