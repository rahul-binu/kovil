<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/app.html}">

<th:block layout:fragment="head">
	<title>Pooja Report</title>
</th:block>

<div layout:fragment="content" class="p-4">
	<link rel="stylesheet" th:href="@{/assets/lib/simplepagination/simplePagination.css}" />

	<div class="flex items-center my-10">
		<div class="flex-grow border-b-2 border-blue-500"></div>
		<span class="px-4 text-2xl font-bold text-gray-800">Pooja Advance Report</span>
		<div class="flex-grow border-b-2 border-blue-500"></div>
	</div>

	<div class="overflow-x-auto mt-2 bg-neutral-primary-soft block border border-default border-t-4 rounded-base shadow-xs"
		id="poojaReportPaginateArea">

		<div class="flex flex-wrap items-center mb-3 mx-2 gap-3 justify-between">

			<div class="flex flex-wrap items-center gap-3">
				<input type="date" id="fromDate" class="border px-3 py-2 rounded-md" th:value="${fo}">
				<input type="date" id="toDate" class="border px-3 py-2 rounded-md" th:value="${to}">
				<input id="allSearchBox" class="w-40 px-3 py-2 border rounded-md" placeholder="Search..." />
				<button id="serchPooja"
					class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
					Search
				</button>
			</div>

			<div class="flex items-center">
				<button id="excelExportPooja"
					class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition">
					Export Excel
				</button>
			</div>

		</div>


		<div class="table-scroll-x">
			<table id="poojaReportTable" class="app-table table-no-wrap table-sticky-col-1 table-sticky-col-2">
				<thead></thead>
				<tbody id="poojaTableBody"></tbody>
				<tfoot></tfoot>
			</table>
		</div>


		<div id="pager" class="mt-4 px-3"></div>

	</div>

	<!-- Pooja Details Modal -->
	<div id="poojaDetailsModal" class="fixed inset-0 z-50 hidden bg-black/50 flex items-center justify-center">

		<div class="bg-white w-full max-w-6xl rounded-lg shadow-lg">

			<div class="flex items-center justify-between px-6 py-4 border-b">
				<h2 id="poojaTitle" class="text-xl font-semibold text-gray-800">
					Pooja Advance Details
				</h2>
				<button onclick="closePoojaModal()" class="text-gray-500 hover:text-gray-700 text-2xl leading-none">
					&times;
				</button>
			</div>

			<div class="p-6">

				<!-- Pooja Meta -->
				<div class="grid grid-cols-1 grid-cols-5 gap-4 mb-6 text-sm">
					<div>
						<span class="font-semibold">Devotee:</span>
						<span id="md-devoteeDetails" class="text-gray-700"></span>
					</div>
					<div>
						<span class="font-semibold">Booking Date:</span>
						<span id="md-bookingDate" class="text-gray-700"></span>
					</div>
					<div>
						<span class="font-semibold">Pooja Total Amount:</span>
						<span id="md-poojaTotalAmount"
							class="px-2 py-0.5 rounded bg-green-100 text-green-700 text-xs"></span>
					</div>
					<div>
						<span class="font-semibold">Advance Amount:</span>
						<span id="md-advanceAmount"
							class="px-2 py-0.5 rounded bg-green-100 text-green-700 text-xs"></span>
					</div>
						<div>
							<input id="md-closeDate" type="date" class="clear-input w-full px-3 py-2 border rounded-md focus:ring focus:border-indigo-400 " th:value="${to}"></input>
						</div>
				</div>

				<div class="grid grid-cols-6 gap-6 mb-3 " id="paymodeAppendBlock">
					<div>
						<label for="payingAmount" id="payingAmountLabel"
							class="block text-gray-700 font-medium mb-1">Paying Amount</label>
						<input type="text" id="payingAmount" name="payingAmount"
							class="clear-input w-full px-3 py-2 border rounded-md focus:ring focus:border-indigo-400 no-drop-color"
							placeholder="0">
					</div>
					<div>
						<label for="payModeChosen" class="block text-gray-700 font-medium mb-1">Paymode</label>
						<select id="payModeChosen"
							class="w-full px-3 py-2 border rounded-md focus:ring focus:border-indigo-400">
						</select>
					</div>

					<div>
						<label for="payingReferenceNumber" class="block text-gray-700 font-medium mb-1">Reference
							Number</label>
						<input type="text" id="payingReferenceNumber"
							class="clear-input w-full px-3 py-2 border rounded-md focus:ring focus:border-indigo-400 "
							placeholder="">
					</div>

					<div>
						<label for="payingReferenceDate" class="block text-gray-700 font-medium mb-1">Reference
							Date</label>
						<input type="date" id="payingReferenceDate"
							class="clear-input w-full px-3 py-2 border rounded-md focus:ring focus:border-indigo-400 "
							placeholder="">
					</div>
					<div>
						<label for="payingAmount" class="block text-gray-700 font-medium mb-1">Reamrk</label>
						<input type="text" id="payingRemark"
							class="clear-input w-full px-3 py-2 border rounded-md focus:ring focus:border-indigo-400 "
							placeholder="">
					</div>
					<div class="flex items-end space-x-3">
						<button id="savePooja"
							class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 shadow">
							Save
						</button>
					</div>

				</div>
				<div class="overflow-x-auto">
					<table class="min-w-full border border-gray-300 text-sm" id="transactionTable">
						<thead class="bg-gray-800 text-white">
							<tr>
								<th class="px-3 py-2 border">#</th>
								<th class="px-3 py-2 border">Date</th>
								<th class="px-3 py-2 border">Receipt No</th>
								<th class="px-3 py-2 border text-right">Amount (₹)</th>
								<th>Pooja Name</th>
								<th>Pooja Group</th>
								<th>Materials List</th>
							</tr>
						</thead>
						<tbody class="bg-white divide-y divide-gray-200">
						</tbody>
				</div>
			</div>

		</div>
	</div>

	<input type="hidden" id="clientName" th:value="${clientName}">
	<input type="hidden" id="clientAddress" th:value="${clientAddress}">

</div>

<div layout:fragment="scripts">
	<script th:src="@{/assets/lib/excel/exceljs.min.js}"></script>
	<script th:src="@{/assets/lib/excel/common.js}"></script>


	<script th:src="@{/assets/lib/simplepagination/simplePagination.min.js}"></script>
	<script th:src="@{/assets/modules/reports/common.js}"></script>
	<script th:src="@{/assets/modules/reports/pooja/pooja_advance.js}"></script>
</div>
